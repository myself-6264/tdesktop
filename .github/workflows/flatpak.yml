Here is the original GitHub Actions workflow file (flatpak.yml) that builds and deploys the Telegram Desktop Flatpak package:
YAML

name: Flatpak Build

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Clone Telegram Desktop repository
        run: git clone https://github.com/myself-6264/tdesktop.git

      - name: Copy manifest file
        run: cp .github/workflows/TelegramMessengerLLP.TelegramDesktop.yml .

      - name: Modify manifest file
        run: sed -i 's|url: https://github.com/telegramdesktop/tdesktop.git|path: ./tdesktop|' TelegramMessengerLLP.TelegramDesktop.yml

      - name: Build Flatpak package
        run: flatpak-builder --repo=repo --force-clean build TelegramMessengerLLP.TelegramDesktop.yml

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: TelegramDesktop
          path: repo/TelegramDesktop.flatpak
